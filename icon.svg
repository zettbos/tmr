<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#060d17"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Delivery / Truck Emblem -->
  <g transform="translate(156, 110)">
    <path d="M20 70 L140 70 L140 130 L20 130 Z" fill="url(#primaryGrad)" rx="8" filter="url(#glow)"/>
    <path d="M140 85 L175 85 L195 110 L195 130 L140 130 Z" fill="url(#primaryGrad)" filter="url(#glow)"/>
    <circle cx="55" cy="135" r="18" fill="#0f172a" stroke="url(#amberGrad)" stroke-width="6"/>
    <circle cx="165" cy="135" r="18" fill="#0f172a" stroke="url(#amberGrad)" stroke-width="6"/>
    <!-- Speed Lines -->
    <line x1="-15" y1="85" x2="5" y2="85" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="-30" y1="102" x2="-5" y2="102" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="-10" y1="118" x2="5" y2="118" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Text "TMR" -->
  <text x="256" y="365" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="#ffffff" text-anchor="middle" letter-spacing="4">TMR</text>

  <!-- Subtitle "TAMARA DELIVERY" -->
  <text x="256" y="415" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="url(#amberGrad)" text-anchor="middle" letter-spacing="6">TAMARA DELIVERY</text>
</svg>

